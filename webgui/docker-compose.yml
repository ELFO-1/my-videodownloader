services:
  videodownloader:
    build: .
    image: videodownloader:local
    container_name: videodownloader
    restart: unless-stopped
    # als smoky (1000:1000) laufen, damit Downloads dem normalen User gehoeren
    user: "1000:1000"
    environment:
      - TZ=Europe/Berlin
      - MEDIA_ROOT=/media
      - DATA_DIR=/data
      - DEST_FOLDERS=downloads,filme,serien,musik,Aufnahmen
    volumes:
      # App-Code (per deploy.sh aktualisiert)
      - /DATA/AppData/videodownloader/app:/app
      # Tokens / Konfiguration (bleibt bei Updates erhalten)
      - /DATA/AppData/videodownloader/data:/data
      # Medien beschreibbar (Jellyfin liest die Ordner nur)
      - /mnt/nextcloud-disk/media:/media
    ports:
      - "8089:8088"
